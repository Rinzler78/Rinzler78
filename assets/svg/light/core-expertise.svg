    <!-- track -->
    <rect x="204" y="55" width="522" height="12" rx="3" fill="#ece4d8"/>
    <!-- peak ghost (outline up to score_max) -->    <!-- current fill -->
    <rect x="204" y="55" width="517" height="12" rx="3" fill="#c75d3e"/>

    <!-- value -->    <text x="876" y="64" text-anchor="end" font-family="'JetBrains Mono', ui-monospace, SF Mono, Menlo, Consolas, monospace" font-size="11" fill="#6b6256">99 · <tspan fill="#c75d3e">expert</tspan></text>
    <!-- label -->
