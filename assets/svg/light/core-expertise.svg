<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="900" height="220" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Core expertise — 4 signature skills with current level (filled) and peak reached (ghost): C# / .NET expert, Bluetooth / BLE / GATT expert, AI-Driven Development advanced, Python advanced.">
  <title>Core expertise</title>
  <desc>Double bars per signature skill: the solid bar is the current level, the outlined extension is the peak ever reached.</desc>

  <rect width="900" height="220" fill="#faf7f2"/>
  <rect x="0" y="0" width="900" height="220" rx="8" fill="#ffffff" stroke="#e0d6c8" stroke-width="1"/>  <text x="24" y="22" font-family="'JetBrains Mono', ui-monospace, SF Mono, Menlo, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="0.08em" fill="#6b6256">CORE EXPERTISE</text>

  <!-- legend -->
  <g transform="translate(650 18)" font-family="'JetBrains Mono', ui-monospace, SF Mono, Menlo, Consolas, monospace" font-size="9.5" fill="#9a8f80">
    <rect x="0" y="-7" width="16" height="7" rx="2" fill="#c75d3e"/>
    <text x="22" y="-1">now</text>
    <rect x="62" y="-7" width="16" height="7" rx="2" fill="none" stroke="#6b6256" stroke-width="1" stroke-dasharray="2 1.5"/>
    <text x="84" y="-1">peak</text>
  </g>
    <!-- label -->
