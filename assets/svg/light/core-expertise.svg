    <rect x="204" y="93" width="459" height="12" rx="3" fill="#c75d3e"/>

    <!-- value -->    <text x="876" y="102" text-anchor="end" font-family="'JetBrains Mono', ui-monospace, SF Mono, Menlo, Consolas, monospace" font-size="11" fill="#6b6256">88 <tspan fill="#9a8f80">/ 96</tspan> · expert</text>
    <!-- label -->
    <text x="24" y="140" font-family="'JetBrains Mono', ui-monospace, SF Mono, Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#1a1a1f">AI-Driven Development</text>

