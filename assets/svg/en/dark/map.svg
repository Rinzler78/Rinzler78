<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Localisation — basé à Senas, Provence-Alpes-Côte d'Azur, France. Coordonnées 43.74 N, 5.06 E.">
  <title>Location — Senas</title>
  <desc>Carte de France stylisée avec marqueur pulsant sur Senas.</desc>

  <rect width="1200" height="320" fill="#0d1117"/>
  <rect x="0" y="0" width="1200" height="320" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>  <text x="24" y="22" font-family="'JetBrains Mono', ui-monospace, SF Mono, Menlo, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="0.08em" fill="#8b949e">LOCATION</text>

  <!-- Coords sticker à droite -->
  <g transform="translate(880 60)">
    <rect x="0" y="0" width="280" height="220" rx="6" fill="#1c2128" stroke="#30363d" stroke-width="1"/>

    <text x="20" y="32" font-family="'JetBrains Mono', ui-monospace, SF Mono, Menlo, Consolas, monospace" font-size="10" letter-spacing="0.1em" fill="#8b949e">COORDS</text>

    <text x="20" y="62" font-family="'JetBrains Mono', ui-monospace, SF Mono, Menlo, Consolas, monospace" font-size="12" fill="#8b949e">lat</text>
    <text x="80" y="62" font-family="'JetBrains Mono', ui-monospace, SF Mono, Menlo, Consolas, monospace" font-size="13" fill="#f78166" font-weight="600">43.74° N</text>

    <text x="20" y="82" font-family="'JetBrains Mono', ui-monospace, SF Mono, Menlo, Consolas, monospace" font-size="12" fill="#8b949e">lon</text>
    <text x="80" y="82" font-family="'JetBrains Mono', ui-monospace, SF Mono, Menlo, Consolas, monospace" font-size="13" fill="#f78166" font-weight="600">5.06° E</text>

    <line x1="20" y1="100" x2="260" y2="100" stroke="#21262d" stroke-width="1"/>

    <text x="20" y="128" font-family="'JetBrains Mono', ui-monospace, SF Mono, Menlo, Consolas, monospace" font-size="10" letter-spacing="0.1em" fill="#8b949e">CITY</text>
    <text x="20" y="148" font-family="'JetBrains Mono', ui-monospace, SF Mono, Menlo, Consolas, monospace" font-size="14" fill="#f0f6fc" font-weight="700">Senas, 13560</text>

    <text x="20" y="170" font-family="'JetBrains Mono', ui-monospace, SF Mono, Menlo, Consolas, monospace" font-size="11" fill="#8b949e">Provence-Alpes-Côte d'Azur</text>

    <line x1="20" y1="186" x2="260" y2="186" stroke="#21262d" stroke-width="1"/>

    <text x="20" y="208" font-family="'JetBrains Mono', ui-monospace, SF Mono, Menlo, Consolas, monospace" font-size="10" fill="#8b949e">tz · Europe/Paris (UTC+1)</text>
  </g>

  <!-- Silhouette France -->
  <g transform="translate(160 70)">
    <path d="M 0,60 L 200,30 L 290,80 L 300,140 L 290,180 L 240,200 L 330,300 L 110,320 L 60,300 L 0,220 L 0,150 Z"
          fill="#1c2128" stroke="#30363d" stroke-width="1.5" stroke-linejoin="round"/>

    <!-- Méditerranée -->
    <path d="M 240,200 L 330,300" stroke="#58a6ff" stroke-width="2" stroke-linecap="round" opacity="0.5"/>

    <!-- Villes de référence -->
    <g fill="#6e7681">
      <circle cx="170" cy="100" r="2"/><text x="178" y="103" font-family="'JetBrains Mono', monospace" font-size="9" fill="#8b949e">Paris</text>
      <circle cx="225" cy="195" r="2"/><text x="233" y="198" font-family="'JetBrains Mono', monospace" font-size="9" fill="#8b949e">Lyon</text>
      <circle cx="240" cy="270" r="2"/><text x="180" y="285" font-family="'JetBrains Mono', monospace" font-size="9" fill="#8b949e">Marseille</text>
      <circle cx="60" cy="240" r="2"/><text x="68" y="243" font-family="'JetBrains Mono', monospace" font-size="9" fill="#8b949e">Bordeaux</text>
      <circle cx="5" cy="100" r="2"/><text x="12" y="103" font-family="'JetBrains Mono', monospace" font-size="9" fill="#8b949e">Brest</text>
    </g>

    <!-- Marqueur Senas -->
    <circle cx="248" cy="258" r="14" fill="none" stroke="#f78166" stroke-width="2" opacity="0">
      <animate attributeName="r" values="6;28;6" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0;0.7" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="248" cy="258" r="6" fill="#f78166" stroke="#0d1117" stroke-width="2"/>
    <text x="262" y="252" font-family="'JetBrains Mono', ui-monospace, SF Mono, Menlo, Consolas, monospace" font-size="11" font-weight="700" fill="#f78166">SENAS</text>
  </g>

  <!-- Ping easter egg en haut à droite -->
  <text x="1176" y="22" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="10" fill="#6e7681">// ping boris ~ 26ms</text>
</svg>
