<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 184" width="1200" height="184" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Modes d'intervention — 4 prestations : Part-time CTO, Solutions architect, Emergency technical support, Freelance technical co-founder">
  <title>Modes d'intervention</title>
  <desc>Cards présentant les modes d'intervention freelance.</desc>

  <rect width="1200" height="184" fill="#0d1117"/>
  <rect x="0" y="0" width="1200" height="184" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>  <text x="24" y="22" font-family="'JetBrains Mono', ui-monospace, SF Mono, Menlo, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="0.08em" fill="#8b949e">MODES D'INTERVENTION</text>
    <rect x="24.0" y="50" width="276.0" height="110" rx="6" fill="#1c2128" stroke="#30363d" stroke-width="1"/>
    <rect x="24.0" y="50" width="3" height="110" rx="1.5" fill="#f78166"/>

    <text x="40.0" y="76" font-family="'JetBrains Mono', ui-monospace, SF Mono, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#f0f6fc">Part-time CTO</text>
    <text x="40.0" y="100" font-family="'system-ui', system-ui, -apple-system, sans-serif" font-size="11" fill="#8b949e">Outsourced technical management over</text>    <text x="40.0" y="116" font-family="'system-ui', system-ui, -apple-system, sans-serif" font-size="11" fill="#8b949e">the long term - architecture</text>    <text x="40.0" y="132" font-family="'system-ui', system-ui, -apple-system, sans-serif" font-size="11" fill="#8b949e">decisions, recruitment, roadmap,</text>
    <rect x="316.0" y="50" width="276.0" height="110" rx="6" fill="#1c2128" stroke="#30363d" stroke-width="1"/>
    <rect x="316.0" y="50" width="3" height="110" rx="1.5" fill="#f78166"/>

    <text x="332.0" y="76" font-family="'JetBrains Mono', ui-monospace, SF Mono, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#f0f6fc">Solutions architect</text>
    <text x="332.0" y="100" font-family="'system-ui', system-ui, -apple-system, sans-serif" font-size="11" fill="#8b949e">Short assignment (1 to 3 weeks):</text>    <text x="332.0" y="116" font-family="'system-ui', system-ui, -apple-system, sans-serif" font-size="11" fill="#8b949e">audit, stack selection, architecture</text>    <text x="332.0" y="132" font-family="'system-ui', system-ui, -apple-system, sans-serif" font-size="11" fill="#8b949e">redesign, migration plan.</text>
    <rect x="608.0" y="50" width="276.0" height="110" rx="6" fill="#1c2128" stroke="#30363d" stroke-width="1"/>
    <rect x="608.0" y="50" width="3" height="110" rx="1.5" fill="#f78166"/>

    <text x="624.0" y="76" font-family="'JetBrains Mono', ui-monospace, SF Mono, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#f0f6fc">Emergency technical support</text>
    <text x="624.0" y="100" font-family="'system-ui', system-ui, -apple-system, sans-serif" font-size="11" fill="#8b949e">Production incident, critical debt,</text>    <text x="624.0" y="116" font-family="'system-ui', system-ui, -apple-system, sans-serif" font-size="11" fill="#8b949e">deployment stalled, team overwhelmed.</text>    <text x="624.0" y="132" font-family="'system-ui', system-ui, -apple-system, sans-serif" font-size="11" fill="#8b949e">I put out the fire and document the</text>
    <rect x="900.0" y="50" width="276.0" height="110" rx="6" fill="#1c2128" stroke="#30363d" stroke-width="1"/>
    <rect x="900.0" y="50" width="3" height="110" rx="1.5" fill="#f78166"/>

    <text x="916.0" y="76" font-family="'JetBrains Mono', ui-monospace, SF Mono, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#f0f6fc">Freelance technical co-founder</text>
    <text x="916.0" y="100" font-family="'system-ui', system-ui, -apple-system, sans-serif" font-size="11" fill="#8b949e">Bringing a product from zero to</text>    <text x="916.0" y="116" font-family="'system-ui', system-ui, -apple-system, sans-serif" font-size="11" fill="#8b949e">market, by working alongside the</text>    <text x="916.0" y="132" font-family="'system-ui', system-ui, -apple-system, sans-serif" font-size="11" fill="#8b949e">non-tech founder.</text></svg>
