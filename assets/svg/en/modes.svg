<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 184" width="1200" height="184" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Modes d'intervention — 4 prestations : Part-time CTO, Solutions architect, Emergency technical support, Freelance technical co-founder">
  <title>Modes d'intervention</title>
  <desc>Cards présentant les modes d'intervention freelance.</desc>

  <rect width="1200" height="184" fill="#faf7f2"/>
  <rect x="0" y="0" width="1200" height="184" rx="8" fill="#ffffff" stroke="#e0d6c8" stroke-width="1"/>  <text x="24" y="22" font-family="'JetBrains Mono', ui-monospace, SF Mono, Menlo, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="0.08em" fill="#6b6256">MODES D'INTERVENTION</text>
    <rect x="24.0" y="50" width="276.0" height="110" rx="6" fill="#f4eee6" stroke="#e0d6c8" stroke-width="1"/>
    <rect x="24.0" y="50" width="3" height="110" rx="1.5" fill="#c75d3e"/>

    <text x="40.0" y="76" font-family="'JetBrains Mono', ui-monospace, SF Mono, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#1a1a1f">Part-time CTO</text>
    <text x="40.0" y="100" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="11" fill="#6b6256">Outsourced technical management over</text>    <text x="40.0" y="116" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="11" fill="#6b6256">the long term - architecture</text>    <text x="40.0" y="132" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="11" fill="#6b6256">decisions, recruitment, roadmap,</text>
    <rect x="316.0" y="50" width="276.0" height="110" rx="6" fill="#f4eee6" stroke="#e0d6c8" stroke-width="1"/>
    <rect x="316.0" y="50" width="3" height="110" rx="1.5" fill="#c75d3e"/>

    <text x="332.0" y="76" font-family="'JetBrains Mono', ui-monospace, SF Mono, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#1a1a1f">Solutions architect</text>
    <text x="332.0" y="100" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="11" fill="#6b6256">Short assignment (1 to 3 weeks):</text>    <text x="332.0" y="116" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="11" fill="#6b6256">audit, stack selection, architecture</text>    <text x="332.0" y="132" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="11" fill="#6b6256">redesign, migration plan.</text>
    <rect x="608.0" y="50" width="276.0" height="110" rx="6" fill="#f4eee6" stroke="#e0d6c8" stroke-width="1"/>
    <rect x="608.0" y="50" width="3" height="110" rx="1.5" fill="#c75d3e"/>

    <text x="624.0" y="76" font-family="'JetBrains Mono', ui-monospace, SF Mono, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#1a1a1f">Emergency technical support</text>
    <text x="624.0" y="100" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="11" fill="#6b6256">Production incident, critical debt,</text>    <text x="624.0" y="116" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="11" fill="#6b6256">deployment stalled, team overwhelmed.</text>    <text x="624.0" y="132" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="11" fill="#6b6256">I put out the fire and document the</text>
    <rect x="900.0" y="50" width="276.0" height="110" rx="6" fill="#f4eee6" stroke="#e0d6c8" stroke-width="1"/>
    <rect x="900.0" y="50" width="3" height="110" rx="1.5" fill="#c75d3e"/>

    <text x="916.0" y="76" font-family="'JetBrains Mono', ui-monospace, SF Mono, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#1a1a1f">Freelance technical co-founder</text>
    <text x="916.0" y="100" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="11" fill="#6b6256">Bringing a product from zero to</text>    <text x="916.0" y="116" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="11" fill="#6b6256">market, by working alongside the</text>    <text x="916.0" y="132" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="11" fill="#6b6256">non-tech founder.</text></svg>
