    <rect x="204" y="93" width="459" height="12" rx="3" fill="#f78166"/>

    <!-- value -->    <text x="876" y="102" text-anchor="end" font-family="'JetBrains Mono', ui-monospace, SF Mono, Menlo, Consolas, monospace" font-size="11" fill="#8b949e">88 <tspan fill="#6e7681">/ 96</tspan> · expert</text>
    <!-- label -->
    <text x="24" y="140" font-family="'JetBrains Mono', ui-monospace, SF Mono, Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#f0f6fc">Python</text>

    <!-- track -->
    <rect x="204" y="131" width="522" height="12" rx="3" fill="#21262d"/>
    <!-- peak ghost (outline up to score_max) -->    <!-- current fill -->
