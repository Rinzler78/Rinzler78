    <!-- track -->
    <rect x="204" y="55" width="522" height="12" rx="3" fill="#21262d"/>
    <!-- peak ghost (outline up to score_max) -->    <!-- current fill -->
    <rect x="204" y="55" width="517" height="12" rx="3" fill="#f78166"/>

    <!-- value -->    <text x="876" y="64" text-anchor="end" font-family="'JetBrains Mono', ui-monospace, SF Mono, Menlo, Consolas, monospace" font-size="11" fill="#8b949e">99 · <tspan fill="#f78166">expert</tspan></text>
    <!-- label -->
