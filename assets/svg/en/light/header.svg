<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200" width="1200" height="200" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Header — Boris Leclere, Freelance CTO - Solutions Architect. Disponible. Basé en Provence-Alpes-Côte d'Azur.">
  <title>Boris Leclere — header</title>
  <desc>Bandeau d'identité du dashboard : nom, rôle, statut, langues, location.</desc>

  <rect width="1200" height="200" fill="#faf7f2"/>

  <rect x="0" y="0" width="1200" height="200" rx="8" fill="#ffffff" stroke="#e0d6c8" stroke-width="1"/>

  <!-- accent stroke gauche -->
  <rect x="0" y="0" width="4" height="200" rx="2" fill="#c75d3e"/>

  <!-- name -->
  <text x="40" y="68" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="42" font-weight="700" fill="#1a1a1f" letter-spacing="-0.02em">Boris Leclere</text>

  <!-- role -->
  <text x="40" y="98" font-family="'JetBrains Mono', ui-monospace, SF Mono, Menlo, Consolas, monospace" font-size="14" fill="#c75d3e" letter-spacing="0.02em">Freelance CTO - Solutions Architect</text>

  <!-- status row -->
  <g transform="translate(40 130)">
    <circle cx="6" cy="8" r="4" fill="#2da44e">
    <animate attributeName="fill-opacity" values="1;0.4;1" dur="1.8s" repeatCount="indefinite"/>
  </circle>
    <text x="20" y="12" font-family="'JetBrains Mono', ui-monospace, SF Mono, Menlo, Consolas, monospace" font-size="12" fill="#2da44e" font-weight="600">available</text>

    <text x="120" y="12" font-family="'JetBrains Mono', ui-monospace, SF Mono, Menlo, Consolas, monospace" font-size="12" fill="#6b6256">·</text>
    <text x="135" y="12" font-family="'JetBrains Mono', ui-monospace, SF Mono, Menlo, Consolas, monospace" font-size="12" fill="#1a1a1f">Senas, France</text>

    <text x="380" y="12" font-family="'JetBrains Mono', ui-monospace, SF Mono, Menlo, Consolas, monospace" font-size="12" fill="#6b6256">·</text>
    <text x="395" y="12" font-family="'JetBrains Mono', ui-monospace, SF Mono, Menlo, Consolas, monospace" font-size="12" fill="#1a1a1f">fr / en</text>

    <text x="465" y="12" font-family="'JetBrains Mono', ui-monospace, SF Mono, Menlo, Consolas, monospace" font-size="12" fill="#6b6256">·</text>
    <text x="480" y="12" font-family="'JetBrains Mono', ui-monospace, SF Mono, Menlo, Consolas, monospace" font-size="12" fill="#1a1a1f">20 years of code</text>
  </g>

  <!-- contact CTAs en haut à droite -->
  <g transform="translate(820 36)">
    <a href="mailto:borisleclere.pro@gmail.com">
      <rect x="0" y="0" width="170" height="36" rx="6" fill="#c75d3e" stroke="#c75d3e" stroke-width="1"/>
      <text x="85" y="23" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, SF Mono, Menlo, Consolas, monospace" font-size="12" font-weight="600" fill="#faf7f2">✉  email</text>
    </a>
    <a href="https://www.linkedin.com/in/borisleclere">
      <rect x="180" y="0" width="170" height="36" rx="6" fill="#f4eee6" stroke="#e0d6c8" stroke-width="1"/>
      <text x="265" y="23" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, SF Mono, Menlo, Consolas, monospace" font-size="12" font-weight="600" fill="#1a1a1f">in  linkedin</text>
    </a>
  </g>

  <!-- tagline en bas -->
  <text x="40" y="178" font-family="'JetBrains Mono', ui-monospace, SF Mono, Menlo, Consolas, monospace" font-size="11" fill="#6b6256" font-style="italic">// still curious · embedded → cloud → ai</text>
</svg>
