    <text x="40.0" y="102" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="11" fill="#8b949e">Design or repair maintainable,</text><text x="40.0" y="117" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="11" fill="#8b949e">testable and upgradeable systems. Get</text><text x="40.0" y="132" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="11" fill="#8b949e">a codebase out of technical debt</text><text x="40.0" y="147" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="11" fill="#8b949e">without rewriting the whole thing.</text>      <rect x="40.0" y="172" width="127.60000000000001" height="18" rx="9" fill="#161b22" stroke="#21262d" stroke-width="1"/>
