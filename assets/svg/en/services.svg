    <text x="362.6666666666667" y="102" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="11" fill="#8b949e">Honest inventory: code, architecture,</text><text x="362.6666666666667" y="117" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="11" fill="#8b949e">testing, CI/CD, security,</text><text x="362.6666666666667" y="132" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="11" fill="#8b949e">documentation. An actionable report,</text><text x="362.6666666666667" y="147" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="11" fill="#8b949e">prioritized by impact.</text>      <rect x="362.6666666666667" y="172" width="47.0" height="18" rx="9" fill="#161b22" stroke="#21262d" stroke-width="1"/>
