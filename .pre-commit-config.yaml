# Quality gates (ADR-005), tiered by responsibility (ADR-012).
#
#   pre-commit       is what I just wrote correct?   seconds — staged files
#                                                    only, impacted tests only
#   pre-push         is the branch green?            full suite + coverage floor
#   pre-merge-commit is it safe to integrate?        + dependency CVE audit
#
# Nothing is skipped, only placed where its cost is worth paying: a full
# `pytest --cov` on every commit makes the red-green-refactor loop unusable,
# and an unusable gate is the one people route around.
#
# Install: pre-commit install --install-hooks   (installs all three types)
default_install_hook_types: [pre-commit, pre-push, pre-merge-commit]

repos:
  # --- File hygiene ------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^(assets/|README(\.en)?\.md$)
      - id: end-of-file-fixer
        exclude: ^(assets/|README(\.en)?\.md$)
      - id: check-json
      - id: check-yaml
      - id: check-added-large-files
      - id: detect-private-key
      - id: check-merge-conflict

  # --- Python lint + format ---------------------------------------------
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.15
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # --- Security ----------------------------------------------------------
  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: ["-c", "pyproject.toml"]
        exclude: ^tests/
        additional_dependencies: ["bandit[toml]"]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  # --- Spelling, per language --------------------------------------------
  #  cspell (en): the hand-written English codebase (code/docs/schemas).
  #  cspell (fr): the pure-FR source translation artifacts (*.fr.txt) only.
  #  Machine-translated EN output (i18n-cache/**/*.en.json) is generated, not
  #  authored, and is excluded from cspell-en via .cspell.json ignorePaths —
  #  translation quality is governed by the `reviewed` flag (ADR-004), not by
  #  a spell-checker fighting place names and DeepL artifacts. Mixed
  #  data/template files (FR content + EN ids) are excluded from both.
  - repo: https://github.com/streetsidesoftware/cspell-cli
    rev: v10.0.0
    hooks:
      - id: cspell
        alias: cspell-en
        name: cspell (en)
        args: ["--config", ".cspell.json", "--no-must-find-files"]
        files: \.(py|md|toml|ya?ml|json)$|^Makefile$|^\.gitignore$
        exclude: \.fr\.(json|md|txt)$
      - id: cspell
        alias: cspell-fr
        name: cspell (fr)
        args: ["--config", ".cspell-fr.json", "--no-must-find-files"]
        files: ^i18n-cache/.*\.fr\.txt$
        additional_dependencies: ["@cspell/dict-fr-fr@^2"]

  # --- Local hooks: data → generation → validation -----------------------
  - repo: local
    hooks:
      - id: validate-data
        name: validate data (schemas + referential integrity)
        entry: python scripts/validate_data.py
        language: python
        additional_dependencies: ["jsonschema>=4.0"]
        pass_filenames: false
        files: ^(data/|schemas/)

      - id: generate-profile
        name: generate README + SVG
        entry: python scripts/generate.py
        language: python
        additional_dependencies: ["jinja2>=3.1", "defusedxml>=0.7", "fonttools>=4.0"]
        pass_filenames: false
        files: ^(data/|scripts/templates/|scripts/.*\.py)$

      - id: validate-generated
        name: validate generated SVG + README refs
        entry: python scripts/validate.py
        language: python
        additional_dependencies: ["defusedxml>=0.7"]
        pass_filenames: false
        files: ^(README(\.en)?\.md|assets/svg/|data/|scripts/)

      # --- pre-commit: only the tests the staged files can affect --------
      # Seconds, not a minute: this gate sits inside the red-green-refactor
      # loop. scripts/impacted_tests.py maps staged paths to guards and widens
      # to the whole suite whenever the mapping is not certain.
      - id: impacted-tests
        name: pytest (impacted by the staged files)
        entry: python scripts/impacted_tests.py
        language: python
        additional_dependencies:
          ["pytest>=8.0", "jsonschema>=4.0", "jinja2>=3.1", "defusedxml>=0.7", "fonttools>=4.0"]
        types_or: [python, json, markdown, yaml]
        # pre-commit batches filenames across concurrent invocations by
        # default. Every run regenerates the artifacts into the same paths, so
        # concurrent runs truncate the files their siblings are parsing — seen
        # as a spurious "no element found" on an SVG that is in fact valid.
        # The generated tree is shared mutable state: one invocation only.
        require_serial: true
        stages: [pre-commit]

      # --- pre-push: the branch as a whole -------------------------------
      - id: pytest
        name: pytest + coverage (>=90% engine)
        entry: pytest -q --cov --cov-fail-under=90
        language: python
        additional_dependencies:
          ["pytest>=8.0", "pytest-cov>=4.0", "jsonschema>=4.0", "jinja2>=3.1", "defusedxml>=0.7", "fonttools>=4.0"]
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      # --- pre-merge-commit: integration safety --------------------------
      # Dependency CVEs are a property of the dependency set, not of a commit,
      # and the check needs the network. It belongs on the gate that
      # integrates work, plus CI — not on every push.
      #
      # `language: system` is deliberate: pip-audit audits the environment it
      # runs in, so an isolated pre-commit venv makes it audit its own
      # placeholder package (`pre-commit-placeholder-package 0.0.0`, not on
      # PyPI) and fail while never looking at this project's dependencies.
      # Here it runs in the dev environment, where the project is installed.
      - id: pip-audit
        name: pip-audit (dependency CVEs)
        entry: pip-audit
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-merge-commit]

      - id: pytest-merge
        name: pytest + coverage before a merge lands
        entry: pytest -q --cov --cov-fail-under=90
        language: python
        additional_dependencies:
          ["pytest>=8.0", "pytest-cov>=4.0", "jsonschema>=4.0", "jinja2>=3.1", "defusedxml>=0.7", "fonttools>=4.0"]
        pass_filenames: false
        always_run: true
        stages: [pre-merge-commit]
