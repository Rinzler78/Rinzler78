# Quality gates (ADR-005). Remplace l'ancien hook shell install-hook.sh.
# Installer : pre-commit install --install-hooks
#             pre-commit install --hook-type pre-push
default_install_hook_types: [pre-commit, pre-push]

repos:
  # --- Hygiène fichiers --------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^(assets/|README\.md$)
      - id: end-of-file-fixer
        exclude: ^(assets/|README\.md$)
      - id: check-json
      - id: check-yaml
      - id: check-added-large-files
      - id: detect-private-key
      - id: check-merge-conflict

  # --- Lint + format Python ---------------------------------------------
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.15
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # --- Sécurité ----------------------------------------------------------
  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: ["-c", "pyproject.toml"]
        exclude: ^tests/
        additional_dependencies: ["bandit[toml]"]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  # --- Orthographe (EN uniquement, surfaces anglaises) -------------------
  - repo: https://github.com/streetsidesoftware/cspell-cli
    rev: v10.0.0
    hooks:
      - id: cspell
        files: ^(schemas/.*\.json|.*\.toml|\.pre-commit-config\.yaml)$

  # --- Hooks locaux : data → génération → validation ---------------------
  - repo: local
    hooks:
      - id: validate-data
        name: validate data (schemas + référentiel)
        entry: python scripts/validate_data.py
        language: python
        additional_dependencies: ["jsonschema>=4.0"]
        pass_filenames: false
        files: ^(data/|schemas/)

      - id: generate-profile
        name: generate README + SVG
        entry: python scripts/generate.py
        language: python
        additional_dependencies: ["jinja2>=3.1", "defusedxml>=0.7"]
        pass_filenames: false
        files: ^(data/|scripts/templates/|scripts/.*\.py)$

      - id: validate-generated
        name: validate generated SVG + README refs
        entry: python scripts/validate.py
        language: python
        additional_dependencies: ["defusedxml>=0.7"]
        pass_filenames: false
        files: ^(README\.md|assets/svg/|data/|scripts/)

      # --- pre-push : tests + audit deps --------------------------------
      - id: pytest
        name: pytest + couverture (>=90% moteur)
        entry: pytest -q --cov --cov-fail-under=90
        language: python
        additional_dependencies:
          ["pytest>=8.0", "pytest-cov>=4.0", "jsonschema>=4.0", "jinja2>=3.1", "defusedxml>=0.7"]
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: pip-audit
        name: pip-audit (CVE dépendances)
        entry: pip-audit
        language: python
        additional_dependencies: ["pip-audit>=2.7"]
        pass_filenames: false
        always_run: true
        stages: [pre-push]
