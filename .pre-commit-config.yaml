# Quality gates (ADR-005). Replaces the old install-hook.sh shell hook.
# Install: pre-commit install --install-hooks
#          pre-commit install --hook-type pre-push
default_install_hook_types: [pre-commit, pre-push]

repos:
  # --- File hygiene ------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^(assets/|README(\.en)?\.md$)
      - id: end-of-file-fixer
        exclude: ^(assets/|README(\.en)?\.md$)
      - id: check-json
      - id: check-yaml
      - id: check-added-large-files
      - id: detect-private-key
      - id: check-merge-conflict

  # --- Python lint + format ---------------------------------------------
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.15
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # --- Security ----------------------------------------------------------
  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: ["-c", "pyproject.toml"]
        exclude: ^tests/
        additional_dependencies: ["bandit[toml]"]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  # --- Spelling, per language --------------------------------------------
  #  cspell (en): the hand-written English codebase (code/docs/schemas).
  #  cspell (fr): the pure-FR source translation artifacts (*.fr.txt) only.
  #  Machine-translated EN output (i18n-cache/**/*.en.json) is generated, not
  #  authored, and is excluded from cspell-en via .cspell.json ignorePaths —
  #  translation quality is governed by the `reviewed` flag (ADR-004), not by
  #  a spell-checker fighting place names and DeepL artifacts. Mixed
  #  data/template files (FR content + EN ids) are excluded from both.
  - repo: https://github.com/streetsidesoftware/cspell-cli
    rev: v10.0.0
    hooks:
      - id: cspell
        alias: cspell-en
        name: cspell (en)
        args: ["--config", ".cspell.json", "--no-must-find-files"]
        files: \.(py|md|toml|ya?ml|json)$|^Makefile$|^\.gitignore$
        exclude: \.fr\.(json|md|txt)$
      - id: cspell
        alias: cspell-fr
        name: cspell (fr)
        args: ["--config", ".cspell-fr.json", "--no-must-find-files"]
        files: ^i18n-cache/.*\.fr\.txt$
        additional_dependencies: ["@cspell/dict-fr-fr@^2"]

  # --- Local hooks: data → generation → validation -----------------------
  - repo: local
    hooks:
      - id: validate-data
        name: validate data (schemas + referential integrity)
        entry: python scripts/validate_data.py
        language: python
        additional_dependencies: ["jsonschema>=4.0"]
        pass_filenames: false
        files: ^(data/|schemas/)

      - id: generate-profile
        name: generate README + SVG
        entry: python scripts/generate.py
        language: python
        additional_dependencies: ["jinja2>=3.1", "defusedxml>=0.7", "fonttools>=4.0"]
        pass_filenames: false
        files: ^(data/|scripts/templates/|scripts/.*\.py)$

      - id: validate-generated
        name: validate generated SVG + README refs
        entry: python scripts/validate.py
        language: python
        additional_dependencies: ["defusedxml>=0.7"]
        pass_filenames: false
        files: ^(README(\.en)?\.md|assets/svg/|data/|scripts/)

      # --- pre-push: tests + deps audit ---------------------------------
      - id: pytest
        name: pytest + coverage (>=90% engine)
        entry: pytest -q --cov --cov-fail-under=90
        language: python
        additional_dependencies:
          ["pytest>=8.0", "pytest-cov>=4.0", "jsonschema>=4.0", "jinja2>=3.1", "defusedxml>=0.7", "fonttools>=4.0"]
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: pip-audit
        name: pip-audit (dependency CVEs)
        entry: pip-audit
        language: python
        additional_dependencies: ["pip-audit>=2.7"]
        pass_filenames: false
        always_run: true
        stages: [pre-push]
