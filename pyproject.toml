[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rinzler-profile"
version = "0.1.0"
description = "Data-driven GitHub profile generator for Rinzler78"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.0", "jinja2>=3.1", "defusedxml>=0.7", "deepl>=1.18"]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-cov>=4.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "ruff>=0.6",
    "bandit>=1.7",
    "pip-audit>=2.7",
    "pre-commit>=3.7",
]

[tool.setuptools]
packages = ["scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -ra"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]

[tool.coverage.run]
source = ["scripts"]
omit = ["scripts/generate.py", "scripts/validate.py"]
