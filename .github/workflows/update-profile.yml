name: Update profile

# Quote "on" so YAML does not parse it as the boolean true (ADR-005).
"on":
  schedule:
    # Every Monday at 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:

# This is the ONLY write-scoped CI workflow: it auto-commits refreshed
# metrics back to the repository. Every other workflow stays read-only.
permissions:
  contents: write

# Serialize runs so a manual dispatch never overlaps the weekly schedule.
concurrency:
  group: update-profile
  cancel-in-progress: false

jobs:
  refresh:
    name: fetch metrics · regenerate · commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package + dev deps
        run: pip install -e ".[dev]"
      - name: Fetch metrics
        # gh CLI is preinstalled on ubuntu runners; it reads GH_TOKEN.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/fetch_metrics.py
      - name: Regenerate profile
        run: python scripts/generate.py
      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: refresh profile metrics"
            git push
          fi
