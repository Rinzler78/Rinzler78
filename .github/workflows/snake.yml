name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: Rinzler78
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23C75D3E&color_dots=%23FAF7F2,%23EAD9C8,%23D6B79A,%23C75D3E,%231A1A1F
            dist/github-contribution-grid-snake-dark.svg?color_snake=%23FFB454&color_dots=%2314171C,%233A2E26,%237F5238,%23C75D3E,%23FFB454

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
