name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: Rinzler78
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%233f6212&color_dots=%23ebedf0,%23d9f99d,%23a3e635,%2365a30d,%233f6212
            dist/github-contribution-grid-snake-dark.svg?color_snake=%23a3e635&color_dots=%23161b22,%231e3a0f,%233f6212,%2365a30d,%23a3e635

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
